[project]
name = "pmtrade"
version = "0.0.0"
description = "Research system for measuring edge over Kalshi prices on economic contracts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.28",
    "lightgbm>=4.5",
    "polars>=1.17",
    "pyarrow>=18.0",
    "scikit-learn>=1.6",
    "websockets>=14.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.122",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pmtrade"]

[tool.ruff]
line-length = 88
target-version = "py312"
# Ruff formats Python blocks inside Markdown. BLUEPRINT.md is the build
# specification reproduced verbatim, including code excerpts whose alignment
# is part of the document; it is a source of truth, not a source file.
extend-exclude = ["BLUEPRINT.md"]

[tool.ruff.lint]
select = [
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Fail loudly rather than silently degrading to Any when a dependency ships no
# type information; every such case should be an explicit, reviewed decision.
disallow_any_unimported = true
files = ["pmtrade", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# CLAUDE.md sets a >=80% coverage bar on new modules for every milestone.
# Enforcing it in addopts makes the bar structural: any run that drops below
# it fails, rather than relying on someone remembering to measure.
addopts = """\
    -q --strict-markers --strict-config \
    --cov=pmtrade --cov-report=term-missing --cov-fail-under=80\
"""
xfail_strict = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]
show_missing = true
